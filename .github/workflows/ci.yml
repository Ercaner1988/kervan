# Kervan CI: kapı (kapi.toml [temel] ek_cargo) ile aynı üç cargo komutu + eklenti
# testleri. Platform Windows: proje ve altın testleri Windows'ta ölçüldü (turso
# derlemesi rc.exe ister). Bu dosya kit tarafından da okunur (kapi
# `.github/workflows/ci.yml`); `run:` satırlarını değiştirirken kitin okuduğu
# biçimi koru.
#
# `eklenti/test` NEDEN BURADA: tarayıcı eklentisinin içerik betiği (menü okuma,
# seçim, yeniden bağlanma) Rust tarafından ayrı bir dilde yaşıyor ve `cargo test`
# onu görmez. Ölçüldü (2026-10-26): paket 26 test / 6 dosya yeşil, ama CI bu
# paketi hiç koşmuyordu — yani eklenti kırılsa CI yeşil kalırdı. Bunu `kapi`
# boyutları da ölçmüyordu; boşluk gerçekti, kapatıldı.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kapi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: eklenti/test
      - run: bun test
        working-directory: eklenti/test
