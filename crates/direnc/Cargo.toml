[package]
name = "kervan-direnc"
version = "0.1.0"
edition = "2024"
description = "Kervan 3 Katmanlı Dayanıklılık: Devre kesici (circuit breaker), bağlantı soğuma (cooldown) ve model kilidi (lockout)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
