[package]
name = "kervan-yonlendirme"
version = "0.1.0"
edition = "2024"
description = "Kervan Akıllı Yönlendirme: 19 kombo stratejisi, hız sınırlayıcı ve anlamsal önbellek"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
