[package]
name = "kervan-v1"
version = "0.1.0"
edition = "2024"
description = "Kervan OpenAI / Anthropic / Gemini uyumlu HTTP v1 API uçları ve döngü koruması"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = "2.0"
kervan-ceviri = { path = "../ceviri" }
kervan-direnc = { path = "../direnc" }
kervan-yonlendirme = { path = "../yonlendirme" }
kervan-depo = { path = "../depo" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
