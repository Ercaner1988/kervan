# Kapı paketi yapılandırması (mühürlenecek: araclar/kapilar/**).
# hepsi.ts faz -> kapı listesini YALNIZ buradan okur. Eksik/bozuk dosya, bilinmeyen faz,
# boş liste ya da P4+ listesinin P3 listesini kapsamaması -> hepsi.ts çıkış != 0.
# Komutlardaki {faz} koşu anında faz adıyla değiştirilir (P4+ üst küme denetimi şablon
# metni üzerinden yapılır, yani P3'teki komut P4+'da harfi harfine bulunmalıdır).
# Her kapının stdout'unun son boş olmayan satırı tam olarak "HUKUM: yesil" ya da
# "HUKUM: kirmizi <neden>" olmalıdır; yoksa kapı kırmızıdır.
# rapor-kontrol her fazın SON kapısıdır: başarı iddiasını yalnız bu koşuda kendisinden önce koşan
# kapıların <ad>.log + kosu.json kaydıyla kanıtlatır (koşu başında listedeki eski günlükler silinir).

[kosucu]
varsayilan_zaman_asimi_sn = 900

# PRD FR-1.4 / §11-O6. Eşikler [Ercan onayı bekliyor: öneri boş RAM >= 6 GB, 60 sn ortalama CPU <= %70].
# kip = "uyari": eşik dışı UYARI yazar, hüküm yesil (kapı sayılmaz, PRD §5).
# kip = "zorunlu": eşik dışı HUKUM: kirmizi. Ercan onaylayınca "zorunlu" yapılıp yeniden mühürlenir.
# Ölçülemeyen/geçersiz eşik ve ölçüm hatası her iki kipte de kırmızıdır.
# §6 durum.json.sayimlar: route_ts bu anlık görüntüde sayılır (node_modules hariç); defter_*
# port/defter/dosyalar.jsonl'den. Kaynak yoksa, sıfır route.ts ya da bozuk defter -> hepsi.ts kırmızı.
[sayim]
kaynak_dizini = "ref/omniroute-dbe703a"

[makine_sakin]
min_bos_ram_gb = 6
max_cpu_pct = 70
ornek_sn = 60
kip = "uyari"

