[package]
name = "kervan"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
gui = ["dep:eframe"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
eframe = { version = "0.30", features = ["wgpu"], optional = true }
fantoccini = "0.22.1"
futures-util = "0.3.34"
log = "0.4"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
divan = { version = "5.0.2", package = "codspeed-divan-compat" }

[[bench]]
name = "kota"
harness = false

[[bench]]
name = "istek"
harness = false

[[bench]]
name = "yapilandirma"
harness = false
