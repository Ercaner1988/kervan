# kervan'ın altin-kapi beyanı. Değer: "uygulanir" ya da "uygulanmaz".
# Anahtarlar altin-kapi CONTEXT.md'deki on altı boyuttur.

# Taban çizgilerindeki ad: klasör adı klonlayana göre değişir, bu değişmez.
repo = "kervan"

[boyut]
arkayuz = "uygulanir"                  # yönlendirici sunucu + MCP
onyuz = "uygulanir"                    # egui arayüzü + tarayıcı eklentisi
veritabani = "uygulanmaz"              # veri deposu yok
makine_zararsizligi = "uygulanir"      # tarayıcı ve alt süreç başlatır
tedarik_guvenligi = "uygulanir"
bellek_guvenligi = "uygulanir"
kimlik_yolu = "uygulanir"              # sağlayıcı oturumları, çerezler
yayina_hazirlik = "uygulanir"
kaynak_tuketimi = "uygulanir"          # oturum havuzu, tarayıcı süreçleri
birlikte_calisabilirlik = "uygulanir"  # eklenti ↔ sunucu köprüsü
karakter_yazimi = "uygulanir"
hata_disiplini = "uygulanir"
test_gercekciligi = "uygulanir"
veri_dayanikliligi = "uygulanir"       # yapılandırma ve kota kayıtları
surum_izi = "uygulanir"
belge_dogrulugu = "uygulanir"

[temel]
# CI (ci.yml) [temel]'deki üç komutu koşar: fmt --check, clippy -D warnings, test.
# kapi'nin boyut ölçümleri ve port kapıları CI DIŞINDADIR: pre-push kancası
# (.githooks/pre-push) kapi'yi koşar; port kapıları elle koşulur.
ek_cargo = [
  ["fmt", "--all", "--", "--check"],
  ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"],
  ["test", "--workspace", "--all-features"],
]

[karakter.muaf]
"crates/havuz/src/router.rs" = "Strateji adı ve model/sağlayıcı kimliği eşleştirmesi Türkçe metin değil; OmniRoute'un yerelden bağımsız JS toLowerCase davranışını (C2 altın paritesi) birebir yansıtır. to_ascii_lowercase Unicode kenar durumlarını (örn. Kelvin işareti) ayırırdı"
"araclar/node_modules/typescript/lib/_tsc.js" = "Üçüncü taraf derlenmiş TypeScript (4 MiB üstü, kapı okuyamaz); depoda izlenen bağımlılık, bu projenin kaynağı değildir"
"araclar/node_modules/typescript/lib/typescript.js" = "Üçüncü taraf derlenmiş TypeScript (4 MiB üstü, kapı okuyamaz); depoda izlenen bağımlılık, bu projenin kaynağı değildir"
